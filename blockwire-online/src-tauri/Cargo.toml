[package]
name = "app"
version = "0.8.35"
description = "Blockwire desktop client"
authors = ["Brain Dump Inneractive"]
license = "AGPL-3.0"
repository = "https://github.com/gremstard/blockwire"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.5.1"
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "sync", "macros", "time"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.34"
